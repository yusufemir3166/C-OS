name: Build C-OS EXE (Windows)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload C-OS.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: C-OS-exe
          path: build/Release/C-OS.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Publish GitHub Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/C-OS.exe
